<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOXBIN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: #00ff00; 
            font-family: monospace; 
            padding: 20px;
            font-size: 14px;
            min-height: 100vh;
        }
        .red { color: #ff0000; }
        .yellow { color: #ffff00; }
        #final { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: #000;
            justify-content: center; 
            align-items: center; 
            flex-direction: column;
            text-align: center;
        }
        #final h1 { 
            color: #ff0066; 
            font-size: 50px; 
            text-shadow: 0 0 20px #ff0066;
            animation: glitch 1s infinite;
        }
        @keyframes glitch {
            0%,100% { transform: translate(0); }
            50% { transform: translate(-2px, 2px); }
        }
        .heart { font-size: 80px; margin-bottom: 20px; }
        button { 
            margin-top: 30px; 
            padding: 15px 30px; 
            background: transparent; 
            border: 2px solid #ff0066; 
            color: #ff0066; 
            font-family: monospace;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    
    <div id="final">
        <div class="heart">❤️</div>
        <h1>TIAMO MOMO</h1>
        <p style="color: #00ffff; font-size: 20px;">você foi hackeada pelo amor 💕</p>
        <button onclick="window.close()">[ FECHAR ]</button>
    </div>

    <script>
        const lines = [
            "DOXBIN v2.0 - SECURE CONNECTION",
            "Target: [REDACTED]",
            "--------------------------------",
            "[+] Initializing breach...",
            "[+] Bypassing firewall...",
            "[+] Accessing database...",
            "",
            ">>> DUMPING DATA <<<",
            "",
            "HEX DUMP:",
            "7F 45 4C 46 02 01 01 00 | .ELF........",
            "02 00 3E 00 01 00 00 00 | ..>.........",
            "",
            "[*] Name: [TARGET]",
            "[*] Status: CUTE ASF",
            "",
            "[!] CRITICAL ERROR",
            "[!] UNEXPECTED VARIABLE",
            "",
            "[*] Decrypting...",
            "..."
        ];
        
        const term = document.getElementById('terminal');
        let i = 0;
        
        function addLine() {
            if (i < lines.length) {
                const div = document.createElement('div');
                div.textContent = lines[i];
                if (lines[i].includes("ERROR")) div.className = "red";
                if (lines[i].includes(">>>")) div.className = "red";
                if (lines[i].includes("HEX") || lines[i].includes("Decrypting")) div.className = "yellow";
                term.appendChild(div);
                window.scrollTo(0, document.body.scrollHeight);
                i++;
                setTimeout(addLine, 200);
            } else {
                setTimeout(() => {
                    document.getElementById('final').style.display = 'flex';
                    if (navigator.vibrate) navigator.vibrate([200,100,200]);
                }, 1000);
            }
        }
        
        setTimeout(addLine, 500);
    </script>
</body>
</html>
